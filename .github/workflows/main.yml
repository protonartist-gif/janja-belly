name: Build macOS
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JanjaBelly-macOS
          path: JanjaBelly-0.2.dmg
